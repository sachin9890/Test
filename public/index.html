<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opencode-remote</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <span id="status-dot" class="status-dot" title="API status"></span>
      <h1>opencode-remote</h1>
      <div class="token-row">
        <input id="token-input" type="password" placeholder="API_TOKEN" autocomplete="off" />
        <button id="token-save">Save token</button>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <main>
      <section class="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-head">
            <h3>Projects</h3>
            <button id="add-project" class="primary small">+ Add</button>
          </div>
          <div id="projects-list" class="projects-list"></div>
        </div>

        <div class="sidebar-section sessions-section">
          <div class="sidebar-head">
            <h3>Sessions</h3>
            <button id="new-session" class="primary small">+ New</button>
          </div>
          <div id="sessions-list" class="sessions-list"></div>
        </div>
      </section>

      <section id="detail-panel" class="detail-panel">
        <div class="empty-state">Select or create a session to get started.</div>
      </section>
    </main>

    <div id="modal-overlay" class="modal-overlay" hidden>
      <div class="modal">
        <div class="modal-head">
          <h2 id="modal-title"></h2>
          <button id="modal-close" class="icon-btn" aria-label="Close">&times;</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
